<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Groots â€” AI Event Planning Intelligence</title>
<style>
:root{color-scheme:light;--bg:#e9e9eb;--panel:#ffffffb8;--ink:#202329;--muted:#73777d;--line:#e4e5e8;--chip:#f0f0f2;--accent:#526a5d}
:root[data-theme=dark]{color-scheme:dark;--bg:#191c20;--panel:#282d33d9;--ink:#edf0f2;--muted:#a8b0b8;--line:#3c424a;--chip:#343b43;--accent:#b7d6bf}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "Helvetica Neue","Segoe UI Variable","Segoe UI",Arial,sans-serif;font-weight:400}
button,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible,select:focus-visible,summary:focus-visible,.page:focus-visible{outline:2px solid #82a798;outline-offset:4px}
.shell{max-width:1280px;width:calc(100% - 48px);margin:24px auto;padding:22px 28px 30px;border:1px solid #ffffff9c;border-radius:28px;background:linear-gradient(140deg,#ffffff28,#ffffff0a);box-shadow:0 16px 44px #20293808;min-height:90vh}
header{display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:4px 0 12px}.brand{display:flex;align-items:center;gap:10px;margin-right:auto}.brand strong{font-size:21px;font-weight:400;letter-spacing:-.06em}.brand svg{width:35px;height:35px;padding:7px;border-radius:11px;background:#15191f}.brand svg path{stroke:#eff3f7}.brand svg circle{fill:#b8d0c4}
nav{display:flex;gap:6px}nav button,.secondary{padding:7px 13px;border:1px solid transparent;background:transparent;border-radius:20px;font-weight:400;color:var(--muted)}nav button:hover{color:var(--ink)}nav button[aria-selected=true]{color:var(--accent)}
.theme-toggle{background:var(--panel);color:var(--ink);font-size:12px}.mode-indicator{display:none}
h1,h2,h3,p{margin:0;font-weight:400}h1{font-size:clamp(28px,3vw,39px);letter-spacing:-.055em;line-height:1.18}h2{font-size:18px;letter-spacing:-.025em}h3{font-size:15px}.lead{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:22px 0 24px}.muted,.lead p{color:var(--muted);font-size:13px;margin-top:5px}
.card{background:var(--panel);border:1px solid #ffffff40;border-radius:23px;padding:22px;box-shadow:0 5px 20px #17262c04;min-width:0;overflow-wrap:anywhere;backdrop-filter:blur(14px)}
.plan-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.budget-panel{grid-column:1/-1}.page[hidden]{display:none}.page{outline:none}
dl{display:grid;grid-template-columns:minmax(110px,1fr) minmax(0,1.3fr);gap:11px;margin:16px 0 0}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere;font-weight:400}
.stack{display:grid;gap:13px}.row,.stat-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.spread{justify-content:space-between}.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;line-height:1.3;padding:5px 9px;border-radius:20px;background:var(--chip);color:var(--muted);font-weight:400}
.accepted,.valid,.pass{background:#dbeee1;color:#355d45}.rejected,.infeasible,.fail,.failed{background:#f4e0e3;color:#894653}.unresolved,.unknown,.unverified{background:#f3e9d8;color:#826338}
pre,.message{font:12px/1.6 Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:30rem;overflow:auto;background:var(--chip);padding:14px;border-radius:13px;margin:10px 0 0}
details{padding:10px 0}summary{cursor:pointer;font-weight:400;overflow-wrap:anywhere}details>div,details>dl{margin-top:10px}.table-scroll{overflow:auto}.data-table{width:100%;border-collapse:collapse;table-layout:fixed}.data-table th,.data-table td{padding:10px 7px;text-align:left;border-bottom:1px solid var(--line);overflow-wrap:anywhere;vertical-align:top;font-weight:400}.data-table th{font-size:12px;color:var(--muted)}.data-table .changed td{background:var(--chip)}.data-table .path{width:27%}.mono{font-size:11px;overflow-wrap:anywhere}.list{padding-left:18px;color:var(--muted)}select{border:1px solid var(--line);border-radius:12px;padding:7px 10px;background:var(--panel)}.secondary{background:var(--panel);color:var(--ink)}
#panel-plan>.card{margin-top:14px}#panel-trace>.card{margin-bottom:14px}#panel-updates>.row{margin-bottom:16px}
@media(max-width:640px){.shell{width:calc(100% - 20px);padding:15px;margin:10px auto;border-radius:21px}header{gap:10px}nav{order:3;width:100%;justify-content:center}.plan-grid{grid-template-columns:1fr}.card{padding:17px}.lead{align-items:start}.data-table td{font-size:12px}.theme-toggle{margin-left:auto}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}



/* Neutral surfaces and subtle pointer tilt */
:root{--ink:#242424;--muted:#666;--accent:#242424;--bg:#e9e9e9;--line:#e4e4e4;--chip:#efefef}
:root[data-theme=dark]{--ink:#eee;--muted:#aaa;--accent:#fff;--bg:#1b1b1b;--panel:#292929;--line:#444;--chip:#343434}
.brand svg{background:#202020}.brand svg circle{fill:#ccc}
.pill{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
:focus-visible{outline-color:var(--muted)}
@media(hover:hover) and (pointer:fine) and (prefers-reduced-motion:no-preference){
    .card{transition:transform .18s ease,box-shadow .18s ease}
    .card:hover{transform:perspective(1000px) rotateX(var(--tile-x,0deg)) rotateY(var(--tile-y,0deg)) translateY(-2px);box-shadow:0 10px 24px #00000012}
}

header{
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
    gap:16px;padding:11px 15px;border-radius:21px;
    border:1px solid #ffffff90;background:#ffffff55;
    backdrop-filter:blur(18px);box-shadow:0 5px 20px #00000006;
}
.theme-toggle{justify-self:end;margin:0}
nav button[aria-selected=true]{color:var(--ink);background:transparent}
.lead{margin:25px 0 17px}
h1{font-size:clamp(28px,3.2vw,42px);letter-spacing:-.055em}
h2{font-size:17px;letter-spacing:-.018em}
.card{background:#fafafa;border:1px solid #fff;box-shadow:0 5px 16px #00000006}
.plan-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.schedule-panel,.judging-panel{grid-column:span 2}
[data-theme=dark] header{background:#ffffff0a;border-color:#ffffff1a}
[data-theme=dark] .card{background:var(--panel);border-color:#ffffff12}
@media(max-width:640px){
    header{grid-template-columns:1fr auto;gap:8px;padding:10px 12px}
    nav{grid-column:1/-1}
    .plan-grid{grid-template-columns:minmax(0,1fr)}
    .schedule-panel,.judging-panel{grid-column:auto}
}


.shell{display:grid;grid-template-columns:175px minmax(0,1fr);gap:16px;padding:0;border:0;background:transparent;box-shadow:none}
.sidebar,.topbar{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:16px}
.sidebar{display:flex;flex-direction:column;align-items:stretch;gap:22px}
.sidebar nav{display:flex;flex-direction:column;width:100%;order:0}
.sidebar nav button{text-align:left;width:100%;color:var(--muted)}
.sidebar nav button[aria-selected=true]{background:#cbb6fa25;color:#634895}
[data-theme=dark] .sidebar nav button[aria-selected=true]{color:#ddcaff}
.sidebar .theme-toggle{align-self:start;margin-top:auto}
.workspace{min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
#upload-status{color:var(--muted);overflow-wrap:anywhere}
.upload-control{position:relative;overflow:hidden;padding:8px 15px;border-radius:20px;background:#d7c3fa;color:#2b203c;white-space:nowrap;cursor:pointer}
.upload-control input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.upload-control:focus-within{outline:2px solid #b89cf0;outline-offset:3px}
.plan-charts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:14px}
.bar-row{margin-top:13px}.bar-row .muted{margin:0}.bar-track{height:8px;border-radius:20px;margin-top:5px;background:var(--chip);overflow:hidden}
.bar-fill{height:100%;background:#bf9ef3;border-radius:inherit}.bar-row:last-child .bar-fill{background:#9c82c5}
@media(max-width:820px){.shell{grid-template-columns:135px minmax(0,1fr)}.plan-charts{grid-template-columns:1fr}}
@media(max-width:560px){.shell{grid-template-columns:1fr}.sidebar{gap:8px;display:grid;grid-template-columns:1fr auto}.sidebar nav{grid-column:1/-1;grid-row:2;flex-direction:row}.sidebar .theme-toggle{margin:0}}




/* Glass surfaces and separate color scales for the plan charts. */
:root {
    --panel: #fffffff0;
    --bg: #f1eff9;
    --line: #dcd8ec;
}
:root[data-theme=dark] {
    --panel: #252535;
    --bg: #181820;
    --line: #414057;
}
body {
    background:
        radial-gradient(ellipse at 0 0, #d8cef9, transparent 55%),
        radial-gradient(ellipse at 100% 0, #ccecf0, transparent 53%),
        radial-gradient(ellipse at 75% 100%, #e9d9f7, transparent 60%),
        var(--bg);
    background-attachment: fixed;
}
[data-theme=dark] body { background: #000; }
.sidebar, .topbar {
    background: linear-gradient(145deg, #ffffffdf, #f7f5ffe0);
    border-color: #ffffffd9;
    box-shadow: 0 10px 34px #4c407615;
    backdrop-filter: blur(18px);
}
[data-theme=dark] .sidebar, [data-theme=dark] .topbar {
    background: linear-gradient(145deg, #303042f0, #242636e8);
    border-color: #55536b;
}
.sidebar nav button[aria-selected=true] { background: linear-gradient(100deg,#e9defc,#f4effc); color: #503574; }
[data-theme=dark] .sidebar nav button[aria-selected=true] { background: linear-gradient(100deg,#484064,#37334d); color: #eee1ff; }
.upload-control {
    background: linear-gradient(115deg,#ece2ff,#cfb6f8 58%,#d7e5ff);
    box-shadow: inset 0 1px 0 #fff9, 0 4px 12px #7b60a933;
}
.card { box-shadow: 0 7px 23px #3b315810; }
[data-theme=dark] .plan-grid > .card {
    background: #111;
    border-color: #292929;
}
.plan-charts > .card, [data-theme=dark] .plan-charts > .card {
    min-height: 170px;
    --ink: #243343;
    --muted: #42525f;
    --chip: #ffffff88;
    color: var(--ink);
    background: radial-gradient(ellipse at 5% 0,#ffffffbe,transparent 80%), var(--chart-surface);
    border-color: #ffffffd4;
    box-shadow: inset 0 1px 0 #fff9, 0 8px 24px #25334916;
}
.plan-charts > .card h2 { margin-bottom: 16px; }
.plan-charts > .card:nth-child(1) {
    --chart-surface: linear-gradient(135deg,#e3fbf4,#a7dfd4);
    --bar-color: linear-gradient(90deg,#64bcb1,#328b83);
}
.plan-charts > .card:nth-child(2) {
    --chart-surface: linear-gradient(135deg,#f7eeff,#d5bbf5);
    --bar-color: linear-gradient(90deg,#a48ad3,#7652b4);
}
.plan-charts > .card:nth-child(3) {
    --chart-surface: linear-gradient(135deg,#ecfaff,#b3dff4);
    --bar-color: linear-gradient(90deg,#6caed1,#397caa);
}
.plan-charts .bar-track { height: 9px; }
.plan-charts .bar-fill { background: var(--bar-color); }
.plan-charts .bar-row:last-child .bar-fill { opacity: .72; }

</style>
