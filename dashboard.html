<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Groots â€” AI Event Planning Intelligence</title>
<style>
:root{color-scheme:light;--bg:#e9e9eb;--panel:#ffffffb8;--ink:#202329;--muted:#73777d;--line:#e4e5e8;--chip:#f0f0f2;--accent:#526a5d}
:root[data-theme=dark]{color-scheme:dark;--bg:#191c20;--panel:#282d33d9;--ink:#edf0f2;--muted:#a8b0b8;--line:#3c424a;--chip:#343b43;--accent:#b7d6bf}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "Segoe UI Variable","Segoe UI","Helvetica Neue",Arial,sans-serif;font-weight:400}
button,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible,select:focus-visible,summary:focus-visible,.page:focus-visible{outline:2px solid #82a798;outline-offset:4px}
.shell{max-width:1280px;width:calc(100% - 48px);margin:24px auto;padding:22px 28px 30px;border:1px solid #ffffff9c;border-radius:28px;background:linear-gradient(140deg,#ffffff28,#ffffff0a);box-shadow:0 16px 44px #20293808;min-height:90vh}
header{display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:4px 0 12px}.brand{display:flex;align-items:center;gap:10px;margin-right:auto}.brand strong{font-size:21px;font-weight:400;letter-spacing:-.06em}.brand svg{width:35px;height:35px;padding:7px;border-radius:11px;background:#15191f}.brand svg path{stroke:#eff3f7}.brand svg circle{fill:#b8d0c4}
nav{display:flex;gap:6px}nav button,.secondary{padding:7px 13px;border:1px solid transparent;background:transparent;border-radius:20px;font-weight:400;color:var(--muted)}nav button:hover{color:var(--ink)}nav button[aria-selected=true]{color:var(--accent)}
.theme-toggle{background:var(--panel);color:var(--ink);font-size:12px}.mode-indicator{display:none}
h1,h2,h3,p{margin:0;font-weight:400}h1{font-size:clamp(28px,3vw,39px);letter-spacing:-.055em;line-height:1.18}h2{font-size:18px;letter-spacing:-.025em}h3{font-size:15px}.lead{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:22px 0 24px}.muted,.lead p{color:var(--muted);font-size:13px;margin-top:5px}
.card{background:var(--panel);border:1px solid #ffffff40;border-radius:23px;padding:22px;box-shadow:0 5px 20px #17262c04;min-width:0;overflow-wrap:anywhere;backdrop-filter:blur(14px)}
.plan-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.budget-panel{grid-column:1/-1}.page[hidden]{display:none}.page{outline:none}
dl{display:grid;grid-template-columns:minmax(110px,1fr) minmax(0,1.3fr);gap:11px;margin:16px 0 0}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere;font-weight:400}
.stack{display:grid;gap:13px}.row,.stat-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.spread{justify-content:space-between}.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;line-height:1.3;padding:5px 9px;border-radius:20px;background:var(--chip);color:var(--muted);font-weight:400}
.accepted,.valid,.pass{background:#dbeee1;color:#355d45}.rejected,.infeasible,.fail,.failed{background:#f4e0e3;color:#894653}.unresolved,.unknown,.unverified{background:#f3e9d8;color:#826338}
pre,.message{font:12px/1.6 Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:30rem;overflow:auto;background:var(--chip);padding:14px;border-radius:13px;margin:10px 0 0}
details{padding:10px 0}summary{cursor:pointer;font-weight:400;overflow-wrap:anywhere}details>div,details>dl{margin-top:10px}.table-scroll{overflow:auto}.data-table{width:100%;border-collapse:collapse;table-layout:fixed}.data-table th,.data-table td{padding:10px 7px;text-align:left;border-bottom:1px solid var(--line);overflow-wrap:anywhere;vertical-align:top;font-weight:400}.data-table th{font-size:12px;color:var(--muted)}.data-table .changed td{background:var(--chip)}.data-table .path{width:27%}.mono{font-size:11px;overflow-wrap:anywhere}.list{padding-left:18px;color:var(--muted)}select{border:1px solid var(--line);border-radius:12px;padding:7px 10px;background:var(--panel)}.secondary{background:var(--panel);color:var(--ink)}
#panel-plan>.card{margin-top:14px}#panel-trace>.card{margin-bottom:14px}#panel-updates>.row{margin-bottom:16px}
@media(max-width:640px){.shell{width:calc(100% - 20px);padding:15px;margin:10px auto;border-radius:21px}header{gap:10px}nav{order:3;width:100%;justify-content:center}.plan-grid{grid-template-columns:1fr}.card{padding:17px}.lead{align-items:start}.data-table td{font-size:12px}.theme-toggle{margin-left:auto}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}


/* Reference-inspired green, orange, and lavender */
.venue-panel{background:radial-gradient(ellipse at 12% 0%,#badd84,transparent 75%),linear-gradient(140deg,#83c575,#329858);color:#153e25}
.venue-panel dt{color:#244d31}
.food-panel{background:radial-gradient(ellipse at 8% 0%,#f5ceaf,transparent 75%),linear-gradient(140deg,#ffb36d,#ff8c37);color:#4a290f}
.food-panel dt{color:#65401d}
.schedule-panel{border-top:2px solid #c2d2b2}
.judging-panel{background:linear-gradient(135deg,#f2effc,#e1dcf2)}
.budget-panel{border-top:2px solid #91bb9a}
.cyan{background:linear-gradient(130deg,#eae7f8,#f4f3fa)}
nav button[aria-selected=true]{color:#438459}
[data-theme=dark] nav button[aria-selected=true]{color:#b3dd94}
[data-theme=dark] .venue-panel{background:radial-gradient(ellipse at 5% 0%,#698b48,transparent 72%),linear-gradient(140deg,#355d3c,#234c36);color:#eff8e9}
[data-theme=dark] .venue-panel dt{color:#d1e5c4}
[data-theme=dark] .food-panel{background:radial-gradient(ellipse at 5% 0%,#aa7447,transparent 72%),linear-gradient(140deg,#7e4e30,#623d29);color:#fff2e4}
[data-theme=dark] .food-panel dt{color:#f1d4b7}
[data-theme=dark] .judging-panel,[data-theme=dark] .cyan{background:linear-gradient(135deg,#3c3652,#2e2d40)}
[data-theme=dark] .judging-panel dt{color:#c5bedc}
[data-theme=dark] .schedule-panel{border-top-color:#70895d}
[data-theme=dark] .budget-panel{border-top-color:#6a9276}

</style>
</head>
<body>

<header>
<div class="brand"><svg viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="m14 2 11 6v12l-11 6-11-6V8l11-6Zm0 6 6 3v6l-6 3-6-3v-6l6-3Zm0 0V2m6 9 5-3m-5 9 5 3m-11 0v6m-6-9-5 3m5-9L3 8" stroke="#c1dbff" stroke-width="1.5" stroke-linejoin="round"/><circle cx="14" cy="14" r="2.5" fill="#b9a7ff"/></svg><strong>Groots</strong></div>
<nav id="nav" aria-label="Dashboard sections" role="tablist"></nav>

<span class="pill mode-indicator" id="view-mode"><span class="dot"></span> <span>Offline report</span></span>
</header>
<main id="pages"></main>

</div>
